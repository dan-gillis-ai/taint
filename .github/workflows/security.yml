# Managed by dan-gillis-ai/platform-gitops — DO NOT EDIT IN PLACE.
#
# Copied from dan-gllis-ai/platform-gitops-workflows by reconcile.py. Drift is corrected on the nightly
# reconcile, so a local edit will be reverted.
# Fix the pipeline in the library, then reconcile.
name: Security
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  vulnerability-audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    # The sibling modules (contracts/gen, policy, taint) are PRIVATE, so Go
    # must not treat them as public: no proxy, no sumdb. Without this the
    # build dies with
    #   could not read Username for 'https://github.com': terminal prompts disabled
    # because the runner has no credential helper for github.com and cannot
    # prompt.
    #
    # The token supplies that credential for the checkout's own GITHUB_TOKEN.
    # It is never written to disk or echoed.
    - name: Configure private module resolution
      env:
        GOPRIVATE: github.com/dan-gillis-ai/*
        GONOSUMDB: github.com/dan-gillis-ai/*
        GOFLAGS: -mod=mod
        # A GitHub App installation token, or a PAT, that can read contracts,
        # policy and taint.
        #
        # NOT secrets.GITHUB_TOKEN: that token is scoped to THIS repository and
        # returns "repository not found" for every sibling. Cross-repo private
        # access needs a credential that spans the org.
        #
        # Falls back to GITHUB_TOKEN so a repo with no libraries to fetch (or an
        # org that has vendored them) still runs rather than failing on a
        # missing secret.
        TOKEN: ${{ secrets.MODULES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        echo "GOPRIVATE=$GOPRIVATE"
    - name: govulncheck (Go)
      if: ${{ hashFiles('go.mod') != '' }}
      run: 'set -euo pipefail

        go install golang.org/x/vuln/cmd/govulncheck@latest

        govulncheck ./...

        '
    - name: Dependency review (PR only)
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
  permissions-audit:
    name: Workflow permissions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
    - name: Every job declares explicit permissions
      run: "set -euo pipefail\nbad=0\nfor wf in .github/workflows/*.y*ml; do\n  [\
        \ -e \"$wf\" ] || continue\n  # A workflow with a top-level permissions block\
        \ is fine; the\n  # failure mode being hunted is the default token silently\
        \ being\n  # broader than the job needs.\n  if ! grep -qE '^\\s*permissions:'\
        \ \"$wf\"; then\n    echo \"::warning file=${wf}::no permissions block \u2014\
        \ inherits the default token\"\n    bad=1\n  fi\ndone\n# Advisory only: this\
        \ warns rather than blocks, because adopting\n# explicit permissions is incremental\
        \ and failing every repo on\n# day one helps nobody.\nexit 0"
