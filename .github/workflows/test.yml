#
# Copied from dan-gllis-ai/platform-gitops-workflows by reconcile.py. Drift is corrected on the nightly
# reconcile, so a local edit will be reverted.
# Fix the pipeline in the library, then reconcile.
name: Test
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.detect.outputs.go }}
      python: ${{ steps.detect.outputs.python }}
      python_pm: ${{ steps.detect.outputs.python_pm }}
    steps:
    - uses: actions/checkout@v4
    - id: detect
      run: |
        set -euo pipefail
        # Presence of the module manifest, not a caller flag: a stale flag
        # would let a suite silently stop running.
        if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

        if [ -f pyproject.toml ] || [ -f setup.py ] || [ -d src ]; then
          echo "python=true" >> "$GITHUB_OUTPUT"
        else
          echo "python=false" >> "$GITHUB_OUTPUT"
        fi

        # WHICH PYTHON PACKAGE MANAGER, detected from the repo rather than
        # assumed. This is not a style preference: it decides whether the test
        # and lint tooling gets installed AT ALL.
        #
        # `pip install -e '.[dev]'` resolves a [project.optional-dependencies]
        # extra. PEP 735 [dependency-groups] is a DIFFERENT namespace that pip
        # does not read. So on a project that declares pytest/ruff/mypy under
        # [dependency-groups], the pip path exits 0 having installed ZERO test
        # tooling, and every downstream check then reports the tool missing.
        # That silent zero is the dangerous part: an install that installed
        # nothing still reads as a successful install.
        #
        # uv.lock is the signal because it is the file uv reads and pip ignores.
        # A [tool.uv] table with NO lockfile gets a warning: --locked cannot
        # verify anything there, so the install falls back to pip and drops the
        # dependency groups silently.
        #
        # go.mod and pyproject.toml coexisting is NOT ambiguous: that is two
        # suites, and each job drives its own toolchain.
        if [ -f uv.lock ]; then
          echo "python_pm=uv" >> "$GITHUB_OUTPUT"
        elif [ -f pyproject.toml ] && grep -qE '^\s*\[tool\.uv\]' pyproject.toml; then
          echo "::warning title=uv project without uv.lock::pyproject.toml declares [tool.uv] but there is no uv.lock, so a --locked sync cannot verify it. Commit a lockfile, or the install falls back to pip and silently drops [dependency-groups]."
          echo "python_pm=pip" >> "$GITHUB_OUTPUT"
        else
          echo "python_pm=pip" >> "$GITHUB_OUTPUT"
        fi

  go:
    name: Test (Go)
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.row.outputs.row }}
      artifacts: ${{ steps.row.outputs.artifacts }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        # Defaults to true, and it hard-fails on any repo whose Go module has
        # no go.sum at the root — `contracts` has a root go.mod but its Go
        # dependencies live in the nested gen/ module. Re-downloading the
        # module cache is cheaper than failing a build for a missing cache key.
        cache: false
    - name: Unit tests
      id: run
      env:
        RACE: true
        COVERAGE: false
      run: "set -euo pipefail\n# -covermode=atomic is mandatory alongside -race: the\
        \ coverage\n# counters are themselves updated concurrently, so a non-atomic\
        \ mode\n# produces a racy profile rather than a wrong-but-quiet one.\nflags=()\n\
        [ \"$RACE\" = \"true\" ] && flags+=(\"-race\")\nif [ \"$COVERAGE\" = \"true\"\
        \ ]; then\n  flags+=(\"-covermode=atomic\" \"-coverprofile=coverage.out\"\
        )\n  echo \"dir=coverage-go-${GITHUB_SHA}\" >> \"$GITHUB_OUTPUT\"\nfi\ngo\
        \ test \"${flags[@]}\" -timeout \"$(( 20 - 5\
        \ ))m\" ./...\n"
    - name: Upload coverage
      if: 'false'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-go-${{ github.sha }}
        path: coverage.out
        if-no-files-found: error
        retention-days: 14
    - id: row
      env:
        RACE: true
        COVERAGE: false
      run: "set -euo pipefail\nrace_state=\"OFF\"; [ \"$RACE\" = \"true\" ] && race_state=\"\
        on (-race)\"\ncov_state=\"off\"; [ \"$COVERAGE\" = \"true\" ] && cov_state=\"\
        collected\"\necho \"row=|| Language | Race detector | Coverage | Tests |||\
        \ Go | ${race_state} | ${cov_state} | pass |\" >> \"$GITHUB_OUTPUT\"\nif [\
        \ \"$COVERAGE\" = \"true\" ]; then\n  echo \"artifacts=coverage-go-${GITHUB_SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"artifacts=\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
  python:
    name: Test (Python)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.row.outputs.row }}
      artifacts: ${{ steps.row.outputs.artifacts }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      if: needs.detect.outputs.python_pm == 'uv'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # Pinned: an unpinned resolver is how a lockfile that verifies today
        # starts failing tomorrow for reasons unrelated to any commit.
        version: '0.12.22'
        python-version: '3.12'
        enable-cache: true
        cache-dependency-glob: 'uv.lock'
    - name: Set up Python
      # setup-python's `cache: pip` keys off a pip-resolvable requirements file,
      # which a uv project does not have. So the uv branch brings its own cache
      # via setup-uv, and this step is skipped rather than failing on a missing
      # dependency file.
      if: needs.detect.outputs.python_pm != 'uv'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install (uv)
      if: needs.detect.outputs.python_pm == 'uv'
      run: |
        set -euo pipefail
        # --locked, NEVER a bare `uv sync`. A bare sync RE-RESOLVES and rewrites
        # uv.lock whenever it disagrees with pyproject.toml, so a stale lockfile
        # quietly installs different code than the one that was reviewed, and CI
        # goes green against a lockfile nobody committed. --locked fails
        # instead, which is the honest outcome: re-lock in its own commit.
        #
        # --all-groups, not `--group dev`: the group NAME is per-repo policy
        # (`dev`, `test`, `lint`, anything), so hardcoding one installs nothing
        # in every repo that picked a different name. This installs whatever
        # [dependency-groups] declares without having to guess.
        uv sync --locked --all-groups
        # uv builds into ./.venv, which nothing else on PATH can see. Without
        # this, `python -m pytest` below runs against the system interpreter and
        # reports pytest missing -- the same symptom, merely relocated.
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        # Report the venv explicitly: GITHUB_PATH takes effect on LATER steps, so
        # `command -v python` here would still name the pre-existing interpreter
        # and print something misleading.
        echo "venv python: $("$PWD/.venv/bin/python" -V 2>&1) at $PWD/.venv/bin"
    - name: Install project (dev extras)
      if: needs.detect.outputs.python_pm != 'uv'
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        # Match [project.optional-dependencies] ONLY. The previous check also
        # accepted a bare `dev =` line, which a PEP 735 [dependency-groups] table
        # matches -- so a uv project took this branch and installed nothing.
        if grep -q 'optional-dependencies' pyproject.toml 2>/dev/null; then
          pip install -e '.[dev]'
        elif [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        else
          echo "::notice::No dev extras found; installing the test runner directly"
          pip install pytest 'pytest-cov==7.0.0'
        fi

    - name: Verify the test runner and its timeout plugin are present
      id: probe
      env:
        COVERAGE: false
      run: "set -euo pipefail\nmissing=0\npython -c 'import pytest' 2>/dev/null ||\
        \ { echo \"::error::pytest is not installed after the install step\"; missing=1;\
        \ }\nif [ \"$COVERAGE\" = \"true\" ]; then\n  python -c 'import pytest_cov'\
        \ 2>/dev/null || {\n    echo \"::error::coverage was requested but pytest-cov\
        \ is unavailable. Requesting coverage that silently produces nothing is worse\
        \ than not requesting it.\"\n    missing=1\n  }\nfi\n# pytest-timeout is optional:\
        \ it produces a precise failure naming\n# the test that hung, which timeout-minutes\
        \ alone cannot do. Its\n# absence degrades the message, not the safety, so\
        \ it is not fatal.\nif python -c 'import pytest_timeout' 2>/dev/null; then\n\
        \  echo \"has_timeout=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::notice::pytest-timeout\
        \ is not installed; per-test timeouts are disabled (job timeout-minutes still\
        \ applies)\"\n  echo \"has_timeout=false\" >> \"$GITHUB_OUTPUT\"\nfi\nexit\
        \ \"$missing\"\n"
    - name: Unit tests
      env:
        COVERAGE: false
        HAS_TIMEOUT: ${{ steps.probe.outputs.has_timeout }}
      run: "set -euo pipefail\nextra=\"\"\n[ \"$HAS_TIMEOUT\" = \"true\" ] && extra=\"\
        --timeout=$(( 20 * 60 - 120 ))\"\nif [ \"$COVERAGE\"\
        \ = \"true\" ]; then\n  python -m pytest -q $extra --cov --cov-report=term-missing\
        \ --cov-report=xml:coverage.xml\nelse\n  python -m pytest -q $extra\nfi\n"
    - name: Upload coverage
      if: 'false'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-python-${{ github.sha }}
        path: coverage.xml
        if-no-files-found: error
        retention-days: 14
    - id: row
      env:
        COVERAGE: false
      run: "set -euo pipefail\ncov_state=\"off\"; [ \"$COVERAGE\" = \"true\" ] &&\
        \ cov_state=\"collected\"\necho \"row=|| Language | Race detector | Coverage\
        \ | Tests ||| Python | n/a (CPython GIL serialises bytecode; use a thread-safe\
        \ harness to assert on shared state) | ${cov_state} | pass |\" >> \"$GITHUB_OUTPUT\"\
        \nif [ \"$COVERAGE\" = \"true\" ]; then\n  echo \"artifacts=coverage-python-${GITHUB_SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"artifacts=\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
  swift:
    name: Test (Swift)
    if: 'false'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.row.outputs.row }}
      artifacts: ${{ steps.row.outputs.artifacts }}
    steps:
    - uses: actions/checkout@v4
    - name: Resolve the xcodebuild scheme
      id: scheme
      env:
        REQUESTED: ''
        BUDGET_MINUTES: 20
      run: "set -euo pipefail\nif [ -n \"$REQUESTED\" ]; then\n  echo \"scheme=$REQUESTED\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"Using caller-specified scheme: $REQUESTED\"\
        \n  exit 0\nfi\n# -list -json is machine-readable; parsing it beats grepping\
        \ human\n# output. Project and workspace shapes differ, so check both.\nxcodebuild\
        \ -list -json > list.json\nschemes=\"$(python3 - <<'PY'\nimport json\nwith\
        \ open(\"list.json\") as fh:\n    data = json.load(fh)\nfor key in (\"workspace\"\
        , \"project\"):\n    found = data.get(key, {}).get(\"schemes\") or []\n  \
        \  shared = [s for s in found if not s.endswith(\" Tests\")]\n    if shared:\n\
        \        print(\"\\n\".join(shared))\n        break\nPY\n)\"\ncount=\"$(printf\
        \ '%s' \"$schemes\" | grep -c . || true)\"\nif [ \"$count\" -eq 0 ]; then\n\
        \  echo \"::error::No shared xcodebuild scheme found. A test job that builds\
        \ nothing is not a pass \u2014 create a shared scheme in the calling repo\
        \ or pass the swift-scheme input.\"\n  exit 1\nelif [ \"$count\" -gt 1 ];\
        \ then\n  echo \"::error::The project exposes $count shared schemes. Refusing\
        \ to guess which one to test:\"\n  printf '  - %s\\n' $schemes\n  echo \"\
        Pass the swift-scheme input explicitly.\"\n  exit 1\nfi\necho \"scheme=$schemes\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"Auto-detected scheme: $schemes\"\n"
    - name: Unit tests
      id: run
      env:
        SCHEME: ${{ steps.scheme.outputs.scheme }}
        COVERAGE: false
        BUDGET_MINUTES: 20
      run: "set -euo pipefail\nargs=(\n  test\n  -scheme \"$SCHEME\"\n  -destination\
        \ \"platform=macOS,arch=$(uname -m)\"\n  # Per-test and per-suite caps inside\
        \ XCTest, so a hanging test is\n  # reported as a hang against a named test\
        \ rather than as a job\n  # timeout against the whole suite. timeout-minutes\
        \ is still the\n  # outer backstop.\n  -test-timeouts-enabled YES\n  -default-test-execution-time-allowance\
        \ $(( $BUDGET_MINUTES * 60 - 120 ))\n)\nif [ \"$COVERAGE\" = \"true\" ]; then\n\
        \  rm -rf TestResults.xcresult\n  args+=(-resultBundlePath TestResults.xcresult\
        \ -enableCodeCoverage YES)\nfi\nset -x\nxcodebuild \"${args[@]}\"\n"
    - name: Upload coverage
      if: 'false'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-swift-${{ github.sha }}
        path: TestResults.xcresult
        if-no-files-found: error
        retention-days: 14
    - id: row
      env:
        COVERAGE: false
      run: 'set -euo pipefail

        cov_state="off"; [ "$COVERAGE" = "true" ] && cov_state="collected"

        echo "row=|| Language | Race detector | Coverage | Tests ||| Swift (TSan-capable;
        \`swift test --sanitize=thread\` locally for a data-race pass) | ${cov_state}
        | pass |" >> "$GITHUB_OUTPUT"

        echo "artifacts=" >> "$GITHUB_OUTPUT"

        '
  summary:
    name: Test summary
    needs:
    - detect
    - go
    - python
    - swift
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.render.outputs.report }}
      artifacts: ${{ steps.render.outputs.artifacts }}
    steps:
    - id: render
      env:
        GO: ${{ needs.go.outputs.report }}
        PY: ${{ needs.python.outputs.report }}
        SW: ${{ needs.swift.outputs.report }}
      run: "set -euo pipefail\nrows=\"\"\nartifacts=\"\"\nfor pair in \"Go|${GO}\"\
        \ \"Python|${PY}\" \"Swift|${SW}\"; do\n  lang=\"${pair%%|*}\"; body=\"${pair#*|}\"\
        \n  if [ -n \"$body\" ]; then\n    rows=\"${rows}${body}\"$'\\n'\n  else\n\
        \    rows=\"${rows}|| ${lang} | not run | off | _no suite executed_ |\"$'\\\
        n'\n  fi\ndone\nfor a in \"${{ needs.go.outputs.artifacts }}\" \"${{ needs.python.outputs.artifacts\
        \ }}\"; do\n  [ -n \"$a\" ] && artifacts=\"${artifacts}${artifacts:+,}${a}\"\
        \ndone\n{\n  echo \"### Unit tests\"\n  echo\n  echo \"$rows\"\n  if [ -n\
        \ \"$artifacts\" ]; then\n    echo\n    echo \"Coverage artifacts: \\`${artifacts}\\\
        `\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\nprintf 'report<<EOF\\n%s\\nEOF\\\
        n' \"$rows\" >> \"$GITHUB_OUTPUT\"\necho \"artifacts=$artifacts\" >> \"$GITHUB_OUTPUT\""
