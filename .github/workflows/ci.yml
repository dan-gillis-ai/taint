#
# Copied from dan-gllis-ai/platform-gitops-workflows by reconcile.py. Drift is corrected on the nightly
# reconcile, so a local edit will be reverted.
# Fix the pipeline in the library, then reconcile.
name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.detect.outputs.go }}
      python: ${{ steps.detect.outputs.python }}
    steps:
    - uses: actions/checkout@v4
    - id: detect
      run: 'set -euo pipefail

        # Presence of go.mod at the root is the signal, not a config flag:

        # a stale flag would let CI skip a suite that exists.

        if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false"
        >> "$GITHUB_OUTPUT"; fi

        if [ -f pyproject.toml ] || [ -d src ]; then echo "python=true" >> "$GITHUB_OUTPUT";
        else echo "python=false" >> "$GITHUB_OUTPUT"; fi

        '
  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    # The sibling modules (contracts/gen, policy, taint) are PRIVATE, so Go
    # must not treat them as public: no proxy, no sumdb. Without this the
    # build dies with
    #   could not read Username for 'https://github.com': terminal prompts disabled
    # because the runner has no credential helper for github.com and cannot
    # prompt.
    #
    # The token supplies that credential for the checkout's own GITHUB_TOKEN.
    # It is never written to disk or echoed.
    - name: Configure private module resolution
      env:
        GOPRIVATE: github.com/dan-gillis-ai/*
        GONOSUMDB: github.com/dan-gillis-ai/*
        GONOSUMCHECK: '1'
        GOFLAGS: -mod=mod
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/
      run: |
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        echo "GOPRIVATE=$GOPRIVATE"
        cache: true
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./... -race -timeout 15m
  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        pip install -e ''.[dev]''

        '
    - name: Test
      run: pytest -q --timeout=300
